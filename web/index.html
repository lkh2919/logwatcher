<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogWatcher - nginx·HAProxy 위협 로그 점검</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--sub:#667085;--line:#e3e6ec;--hi:#d92d20;--hib:#fef3f2;--mid:#dc6803;--midb:#fffaeb;--lo:#5b5fc7;--lob:#f1f1fd;--ok:#067647;--okb:#ecfdf3;--acc:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1a1e28;--ink:#e6e9f0;--sub:#9aa3b5;--line:#2b3140;--hi:#f97066;--hib:#3b1a18;--mid:#fdb022;--midb:#3a2a0c;--lo:#a4a8f0;--lob:#23244a;--ok:#47cd89;--okb:#10301f;--acc:#6ea0ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
header{padding:14px 20px;display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);background:var(--card)}
header b{font-size:18px}header span{color:var(--sub);font-size:12px}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
h2{font-size:14px;margin:0 0 10px}
#drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--sub);cursor:pointer}
#drop.on{border-color:var(--acc);color:var(--acc)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--sub);font-weight:600}
.mono{font-family:Consolas,monospace;font-size:12px;word-break:break-all}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.l3{background:var(--hib);color:var(--hi)}.l2{background:var(--midb);color:var(--mid)}.l1{background:var(--lob);color:var(--lo)}
.chip{display:inline-block;margin:1px 3px 1px 0;padding:0 7px;border-radius:5px;font-size:12px;border:1px solid var(--line)}
.chip.l3{border-color:var(--hi)}.chip.l2{border-color:var(--mid)}.chip.l1{border-color:var(--lo)}
#verdict{border-radius:10px;padding:16px 18px;font-size:20px;font-weight:700;margin-bottom:14px}
#verdict.ok{background:var(--okb);color:var(--ok)}#verdict.alert{background:var(--hib);color:var(--hi)}
#verdict small{display:block;font-size:13px;font-weight:400;color:var(--sub);margin-top:2px}
.warn{background:var(--midb);color:var(--mid);border-radius:8px;padding:8px 12px;margin-bottom:12px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
button,select{font:inherit;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
tr.row{cursor:pointer}tr.row:hover{background:var(--bg)}
.detail{background:var(--bg);padding:10px 14px}
.f{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}
.f h3{font-size:13px;margin:0 0 4px}.f p{margin:4px 0}.f ul{margin:2px 0 6px 18px;padding:0}
.k{color:var(--sub);font-size:12px;font-weight:600;margin-top:6px}
.sw{color:var(--hi);font-weight:700}
.muted{color:var(--sub)}
details summary{cursor:pointer;color:var(--acc)}
.err{color:var(--hi)}
#out.busy{opacity:.45;transition:opacity .15s}
#busy{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9;background:var(--acc);color:#fff;border-radius:20px;padding:6px 16px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.25);display:none}
#busy.on{display:block}
.foreign{color:var(--mid);font-weight:600}
footer{max-width:1100px;margin:0 auto;padding:4px 16px 24px;font-size:12px;color:var(--sub)}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}th.sortable:hover{color:var(--ink)}th.on{color:var(--acc)}
.info{background:var(--lob);color:var(--lo);border-radius:8px;padding:8px 12px;margin-bottom:12px}
.ev td{font-size:12px}
@media (max-width:700px){main{padding:8px}th:nth-child(n+5),td:nth-child(n+5){display:none}}
</style>
</head>
<body>
<div id="busy" role="status" aria-live="polite"></div>
<header><b>LogWatcher</b><span>nginx·HAProxy 위협 로그 점검 · <span id="ver"></span></span></header>
<main>
  <div class="card">
    <div class="bar"><h2 style="margin:0">1. 로그 파일 올리기</h2><span style="flex:1"></span><button id="reset">전체 초기화</button></div>
    <div id="drop">nginx access.log 파일을 여기로 끌어다 놓거나 클릭해서 선택하세요<br>
      <small>nginx access.log(combined·JSON·대괄호형) · nginx error.log · HAProxy 로그, .gz 지원 · 분할(회전)된 로그·HAProxy와 nginx 로그를 한꺼번에 선택할 수 있습니다 · 파일은 이 PC 밖으로 전송되지 않습니다</small>
      <input id="file" type="file" multiple hidden></div>
    <div id="msg" style="margin-top:8px"></div>
    <div id="files"></div>
  </div>
  <div id="out"></div>
  <details class="card" id="lvguide"><summary>위험도 기준 안내</summary><div id="lvbody"></div></details>
</main>
<footer id="geonote"></footer>
<script>
"use strict";
const $ = id => document.getElementById(id);
let STATUS = null, SUM = null;
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LV = {3:"높음",2:"중간",1:"낮음"};
const badge = l => `<span class="badge l${l}">${LV[l]||"-"}</span>`;

// 접근 토큰: 프로그램이 열어 준 주소의 # 뒤에 있다. 서버로 전송되지 않으며, 읽은 뒤 주소창에서 지우고 이 탭에만 보관한다.
let TOKEN = "";
try { TOKEN = sessionStorage.getItem("lw_token") || ""; } catch (e) { /* 저장소를 못 쓰면 이번 로드에서만 사용 */ }
if (location.hash.length > 1) {
  TOKEN = decodeURIComponent(location.hash.slice(1));
  try { sessionStorage.setItem("lw_token", TOKEN); } catch (e) { /* 무시 */ }
  history.replaceState(null, "", location.pathname);
}
const authHeaders = () => ({"X-LW-Token": TOKEN});

async function api(path, opt) {
  opt = Object.assign({}, opt, {headers: Object.assign({}, authHeaders(), (opt || {}).headers)});
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({error: "응답을 읽을 수 없습니다"}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

let SEQ = 0, BUSY_T0 = 0, BUSY_TIMER = null;
function busy(on, text) {
  const b = $("busy"), out = $("out");
  clearInterval(BUSY_TIMER);
  if (!on) { b.classList.remove("on"); out.classList.remove("busy"); return; }
  BUSY_T0 = Date.now();
  const tick = () => { b.textContent = `${text} ${Math.floor((Date.now() - BUSY_T0) / 1000)}초`; };
  tick(); b.classList.add("on"); out.classList.add("busy");
  BUSY_TIMER = setInterval(tick, 250);
}
function render() {
  const y = window.scrollY;                         // 다시 그려도 보던 위치를 유지
  renderFiles(); renderOut(); renderGeoNote();
  window.scrollTo(0, y);
}
// 설정(분석 범위·IP 구분·정렬)을 바꾸면 같은 요청으로 새 결과를 받는다.
// 로그가 크면 몇 초 걸리므로 '분석 중'을 바로 보여주고, 그 사이 또 바꾸면 마지막 선택만 반영한다.
async function change(url) {
  const my = ++SEQ;
  busy(true, "분석 중…");
  try {
    const j = await api(url, {method: "POST"});
    if (my !== SEQ) return;                         // 더 새로운 선택이 있었음: 이 응답은 버린다
    SUM = j.stale ? await api("/api/summary") : j;
    render();
  } catch (e) {
    if (my === SEQ) $("msg").innerHTML = `<span class="err">${esc(e.message)}</span>`;
  } finally {
    if (my === SEQ) busy(false);
  }
}

async function init() {
  STATUS = await api("/api/status");
  $("ver").textContent = "v" + STATUS.version;
  $("lvbody").innerHTML = STATUS.level_guide.map(g =>
    `<p>${badge(g.level)} <b>${esc(g.when)}</b> — ${esc(g.summary)}</p><ul>${g.detail.map(d => `<li>${esc(d)}</li>`).join("")}</ul>`).join("") +
    `<ul>${STATUS.level_notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>`;
  await refresh();
}

// 토큰 헤더가 필요해 주소 이동 대신 fetch로 받아 저장한다
async function downloadCsv() {
  try {
    const r = await fetch("/api/export/result.csv", {headers: authHeaders()});
    if (!r.ok) throw new Error(r.status === 401 ? "접근 토큰이 올바르지 않습니다" : r.status);
    const name = ((r.headers.get("Content-Disposition") || "").match(/filename="([^"]+)"/) || [])[1] || "result.csv";
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (e) { $("msg").innerHTML = `<span class="err">CSV 저장 실패: ${esc(e.message)}</span>`; }
}

function renderGeoNote() {
  const g = STATUS && STATUS.geo;
  $("geonote").innerHTML = g && g.available
    ? `IP 국가 정보: <a href="https://db-ip.com" target="_blank" rel="noopener">IP Geolocation by DB-IP</a> (CC BY 4.0) · 데이터 ${esc((g.source.match(/\d{4}-\d\d/) || [""])[0])} 기준 · 국가 판별은 참고용이며 정확하지 않을 수 있습니다.`
    : "";
}

async function upload(files) {
  const msg = $("msg"); msg.innerHTML = "";
  for (const f of files) {
    msg.innerHTML = `분석 중… ${esc(f.name)}`;
    try {
      const r = await fetch("/api/upload?name=" + encodeURIComponent(f.name), {method: "POST", body: f, headers: authHeaders()});
      const j = await r.json();
      if (!r.ok) msg.innerHTML += `<div class="err">${esc(j.name || f.name)}: ${esc(j.error)}</div>`;
    } catch (e) { msg.innerHTML += `<div class="err">${esc(f.name)}: ${esc(e.message)}</div>`; }
  }
  if (!msg.querySelector(".err")) msg.textContent = "분석이 끝났습니다.";
  await refresh();
}

async function refresh() {
  const my = ++SEQ;
  busy(true, "분석 중…");
  try {
    const j = await api("/api/summary");
    if (my !== SEQ) return;
    SUM = j;
    render();
  } finally {
    if (my === SEQ) busy(false);
  }
}

function renderFiles() {
  const fs = SUM.files || [];
  const hasRange = fs.some(f => f.in_range !== undefined);
  $("files").innerHTML = !fs.length ? "" : `<table><tr><th>파일</th><th>형식</th><th>줄 수</th><th>기간</th>${hasRange ? "<th>분석 범위 내</th><th>제외·병합</th>" : ""}<th>읽기 실패</th></tr>` +
    fs.map(f => `<tr><td>${esc(f.name)}</td><td>${esc(f.format_label)}</td><td>${f.parsed.toLocaleString()}</td><td class="mono">${esc(f.first)} ~ ${esc(f.last)}</td>
    ${hasRange ? `<td>${f.in_range === 0 ? `<span class="err">0</span>` : (f.in_range || 0).toLocaleString()}</td><td class="muted">${f.excluded ? `범위 밖 ${f.excluded.toLocaleString()}` : ""}${f.excluded && f.merged ? " · " : ""}${f.merged ? `중복 병합 ${f.merged.toLocaleString()}` : ""}</td>` : ""}
    <td${f.skipped ? ` title="${esc((f.skipped_samples||[]).join("\n"))}"` : ""}>${f.skipped ? `<span class="err">${f.skipped}줄</span>` : "-"}</td></tr>`).join("") + `</table>`;
}

function rangeSelect() {
  const opts = [[1, "1일"], [3, "3일"], [7, "7일"], [14, "14일"], [30, "30일"], [0, "전체"]];
  const cur = SUM.days;
  if (!opts.some(o => o[0] === cur)) opts.splice(2, 0, [cur, cur + "일"]);
  return `<label class="muted">분석 범위 최근 <select id="range">${opts.map(([v, t]) => `<option value="${v}"${v === cur ? " selected" : ""}>${t}</option>`).join("")}</select></label>`;
}

function rangeText() {
  const r = SUM.range;
  if (!r) return "";
  const base = r.anchor === "now" ? "현재 시각" : "로그의 마지막 시각";
  return (r.days ? `분석 범위 ${r.from} ~ ${r.to} (최근 ${r.days}일, ${base} 기준)` : `분석 범위 전체`) +
    (r.excluded ? ` · 범위 밖 ${r.excluded.toLocaleString()}줄 제외` : "");
}

function rangeHint() {
  const r = SUM.range;
  return r && r.days && r.covers_all
    ? `올린 로그의 기간(${r.log_from} ~ ${r.log_to})이 선택한 범위(최근 ${r.days}일)보다 짧아 로그 전체가 포함됩니다. 범위를 바꿔도 결과가 같은 것은 이 때문입니다.`
    : "";
}

function bindRange() {
  const sel = $("range");
  if (sel) sel.onchange = e => change("/api/range?days=" + e.target.value);
}

function renderOut() {
  const o = $("out");
  if (SUM.empty) {
    if (!(SUM.files || []).length) { o.innerHTML = ""; return; }
    o.innerHTML = `<div class="card"><div class="bar"><h2 style="margin:0">2. 탐지 결과</h2><span style="flex:1"></span>${rangeSelect()}</div>
      <p class="warn">분석 범위 안에 로그가 없습니다. ${esc(rangeText())}<br>범위를 늘리거나 최근 로그를 올려주세요.</p></div>`;
    bindRange();
    return;
  }
  const v = SUM.verdict, req = SUM.mode === "request";
  const notes = [];
  (SUM.notes || []).forEach(n => notes.push({cls: n.type === "warn" ? "warn" : "info", text: esc(n.text)}));
  if (rangeHint()) notes.push({cls: "info", text: esc(rangeHint())});
  if ((SUM.auto_proxies || []).length)
    notes.push({cls: "warn", text: `LB/프록시로 자동 판단된 IP: ${SUM.auto_proxies.map(p => `<b class="mono">${esc(p.ip)}</b>(${p.requests.toLocaleString()}건)`).join(", ")} — 이 IP가 보낸 요청은 <b>X-Forwarded-For의 실제 접속자 IP</b>로 판정했습니다. 맞지 않으면 config.json의 <span class="mono">auto_proxy</span>를 false로 바꾸세요.`});
  let h = `<div id="verdict" class="${v.status}">${v.status === "ok" ? "✔ " : "⚠ "}${esc(v.text)}
    <small>${esc(rangeText())}<br>분석 기간 ${esc(SUM.period[0])} ~ ${esc(SUM.period[1])} · 전체 요청 ${SUM.total.toLocaleString()}건 · 접속 IP ${SUM.unique_ips.toLocaleString()}개${SUM.xff_used ? ` · X-Forwarded-For 사용 ${SUM.xff_used.toLocaleString()}건` : ""}</small></div>`;
  notes.forEach(n => { h += `<div class="${n.cls}">${n.text}</div>`; });
  if (SUM.unreliable && SUM.mode_setting === "auto")
    h += `<div class="warn">IP를 구분할 수 없는 로그로 판단해 <b>요청 단위</b>로 판정했습니다. (${esc(SUM.reason)}) LB 뒤의 로그이고 X-Forwarded-For가 기록되지 않은 경우입니다. IP별 규칙(과다 접속·에러 다수·로그인 시도 등)은 적용되지 않습니다.</div>`;
  h += `<div class="card"><div class="bar"><h2 style="margin:0">2. 탐지 결과</h2><span style="flex:1"></span>
    ${rangeSelect()}
    ${req ? "" : sortControls()}
    <label class="muted">근거 로그 <select id="evdir"><option value="asc">시각 오래된 순</option><option value="desc">시각 최신 순</option></select></label>
    <label class="muted">IP 구분 <select id="mode">
      <option value="auto">자동 판별</option><option value="ip">IP별 판정</option><option value="none">IP 구분 안 함</option></select></label>
    <button class="pri" id="csv">결과 CSV 저장</button></div>`;
  h += req ? renderFindings() : renderIps();
  h += `</div>`;
  h += req ? "" : renderCountries();
  h += renderErrorLog();
  o.innerHTML = h;
  $("mode").value = SUM.mode_setting;
  $("evdir").value = SUM.sort.ev;
  $("evdir").onchange = e => change("/api/sort?ev=" + e.target.value);
  const sk = $("sortkey");
  if (sk) { sk.value = SUM.sort.key; sk.onchange = e => setSort({key: e.target.value}); }
  const sd = $("sortdir"); if (sd) sd.onclick = () => setSort({dir: SUM.sort.dir === "desc" ? "asc" : "desc"});
  o.querySelectorAll("th.sortable").forEach(th => th.onclick = () => {
    const k = th.dataset.key;
    setSort(k === SUM.sort.key ? {dir: SUM.sort.dir === "desc" ? "asc" : "desc"} : {key: k});
  });
  $("mode").onchange = e => change("/api/mode?mode=" + e.target.value);
  $("csv").onclick = downloadCsv;
  bindRange();
  o.querySelectorAll("tr.row").forEach(tr => tr.onclick = () => toggleDetail(tr));
  const lt = $("lowtoggle"); if (lt) lt.onclick = () => { SHOW_LOW = !SHOW_LOW; render(); };
}

function renderCountries() {
  const cs = SUM.countries || [];
  if (!cs.length || !(SUM.geo && SUM.geo.available)) return "";
  const home = (SUM.home_countries || []).join(", ");
  let h = `<details class="card"><summary>국가별 접속 (국내 기준: ${esc(home)})</summary>
    <p class="muted">해외 IP ${SUM.foreign_ips.toLocaleString()}개${SUM.foreign_omitted ? ` · 해외 접속만 있는 IP ${SUM.foreign_omitted.toLocaleString()}개는 목록에서 생략(요청이 많은 상위 2,000개만 표시)` : ""}. 국가는 요청 수 순이며 상위 ${cs.length}개입니다.</p>
    <table><tr><th>국가</th><th>코드</th><th>요청 수</th><th>IP 수</th><th>높음·중간 IP</th></tr>`;
  h += cs.map(c => `<tr><td class="${c.foreign ? "foreign" : ""}">${esc(c.name)}</td><td class="mono">${esc(c.code)}</td><td>${c.requests.toLocaleString()}</td><td>${c.ips.toLocaleString()}</td><td>${c.flagged ? `<b class="sw">${c.flagged}</b>` : "-"}</td></tr>`).join("");
  return h + `</table></details>`;
}

function renderErrorLog() {
  const e = SUM.errorlog;
  if (!e) return "";
  const lv = Object.entries(e.levels).map(([k, v]) => `${esc(k)} ${v.toLocaleString()}건`).join(" · ");
  let h = `<div class="card"><h2>3. 서버 상태 (nginx error.log)</h2>
    <p class="muted">전체 ${e.total.toLocaleString()}줄 (${lv}) · 연결 종료 등 정상 범주 ${e.noise.toLocaleString()}줄 · 보안 신호 ${e.security.toLocaleString()}줄(위 탐지 결과에 반영됨)<br>
    이 항목은 위협 IP 판정(이상 유무)에 포함되지 않는 <b>서버 운영 참고</b> 정보입니다.</p>`;
  if (!e.ops.length) return h + `<p class="muted">운영상 확인이 필요한 오류(emerg·alert·crit·error)가 없습니다.</p></div>`;
  h += e.ops.map(o => `<div class="f"><h3><span class="badge l${o.level === "emerg" || o.level === "alert" || o.level === "crit" ? 3 : 2}">${esc(o.level)}</span> ${esc(o.label)} <span class="muted">— ${o.count.toLocaleString()}건 (${esc(o.first)} ~ ${esc(o.last)})</span></h3>
    <div class="mono muted">${esc(o.sample)}</div>${o.what ? `<div class="k">의미</div><p>${esc(o.what)}</p>` : ""}${o.actions ? `<div class="k">조치 가이드</div><p>${esc(o.actions)}</p>` : ""}</div>`).join("");
  return h + `</div>`;
}

let SHOW_LOW = false;
const SORT_LABEL = {level: "위험도", last: "마지막 접근", first: "첫 접근", requests: "요청 수", ip: "IP", country: "국가"};
const DIR_LABEL = {
  last: {desc: "최신순", asc: "오래된 순"}, first: {desc: "최신순", asc: "오래된 순"},
  requests: {desc: "많은 순", asc: "적은 순"}, level: {desc: "높은 순", asc: "낮은 순"}, ip: {desc: "큰 순", asc: "작은 순"},
  country: {desc: "가나다 역순", asc: "가나다순"},
};
function sortControls() {
  const s = SUM.sort, dl = DIR_LABEL[s.key][s.dir];
  return `<label class="muted">정렬 <select id="sortkey">${Object.entries(SORT_LABEL).map(([k, t]) => `<option value="${k}">${t}</option>`).join("")}</select></label>
    <button id="sortdir" title="정렬 방향 바꾸기">${s.dir === "desc" ? "▼" : "▲"} ${dl}</button>`;
}
function sortTh(key, text) {
  const s = SUM.sort, on = s.key === key;
  return `<th class="sortable${on ? " on" : ""}" data-key="${key}" title="눌러서 정렬 (다시 누르면 방향 반대)">${text}${on ? (s.dir === "desc" ? " ▼" : " ▲") : ""}</th>`;
}
function setSort(p) { return change("/api/sort?" + new URLSearchParams(p).toString()); }
function renderIps() {
  if (!SUM.ips.length) return `<p class="muted">탐지된 IP가 없습니다.</p>`;
  const lowN = SUM.ips.filter(x => x.level === 1).length;
  const rows = SUM.ips.filter(x => SHOW_LOW || x.level > 1);
  let h = lowN ? `<div class="bar muted">${SHOW_LOW ? "낮음 포함 전체" : "높음·중간만 표시"} (${rows.length}개) · 낮음(참고) ${lowN}개 <button id="lowtoggle">${SHOW_LOW ? "낮음 숨기기" : "낮음도 보기"}</button></div>` : "";
  if (!rows.length) return h + `<p class="muted">높음·중간으로 탐지된 IP가 없습니다.</p>`;
  return h + `<table><tr>${sortTh("level", "위험도")}${sortTh("ip", "IP")}${sortTh("country", "국가")}${sortTh("requests", "요청 수")}<th>탐지 내용</th>${sortTh("last", "접근 기간(마지막 접근순)")}</tr>` +
    rows.map(x => `<tr class="row" data-ip="${esc(x.ip)}"><td>${badge(x.level)}</td><td class="mono">${esc(x.ip)}</td><td class="${x.foreign ? "foreign" : ""}" title="${esc(x.country)}">${esc(x.country_name || "")}</td><td>${x.requests ? x.requests.toLocaleString() : "-"}</td>
      <td>${x.is_proxy ? `<span class="chip" title="LB/프록시 자체의 요청이라 실제 접속자 IP를 알 수 없습니다">LB/프록시</span>` : ""}${x.findings.map(f => `<span class="chip l${f.level}">${esc(f.label)}</span>`).join("")}${x.success_warn ? ` <span class="sw" title="공격 요청이 2xx 정상 응답을 받았습니다">⚠ 정상 응답</span>` : ""}</td>
      <td class="mono">${esc(x.first)}<br>~ ${esc(x.last)}</td></tr>`).join("") + `</table>`;
}

function renderFindings() {
  if (!SUM.findings.length) return `<p class="muted">탐지된 항목이 없습니다.</p>`;
  return SUM.findings.map(f => findingHtml(f)).join("");
}

function findingHtml(f) {
  const g = STATUS.rules[f.key] || {};
  const warn = f.success && STATUS.success_warn.includes(f.key);
  const st = Object.entries(f.status || {}).map(([k, v]) => `${k}:${v}건`).join(", ");
  let h = `<div class="f"><h3>${badge(f.level)} ${esc(f.label)} <span class="muted">— ${esc(f.desc)}</span>${warn ? ` <span class="sw">⚠ 정상 응답(2xx) ${f.success}건</span>` : ""}</h3>`;
  if (st) h += `<div class="muted">응답코드 ${esc(st)}</div>`;
  if (g.what) h += `<div class="k">무엇을 탐지했나</div><p>${esc(g.what)}</p>`;
  if (g.causes) h += `<div class="k">추정 원인</div><ul>${g.causes.map(c => `<li>${esc(c)}</li>`).join("")}</ul>`;
  if (g.actions) h += `<div class="k">조치 가이드</div><ul>${g.actions.map(c => `<li>${esc(c)}</li>`).join("")}</ul>`;
  if (g.false_positive) h += `<div class="k">오탐 가능성</div><p>${esc(g.false_positive)}</p>`;
  if (f.evidence && f.evidence.length)
    h += `<div class="k">근거 로그 (${f.evidence_total > f.evidence.length ? `전체 ${f.evidence_total.toLocaleString()}건 중 가장 이른 것·최근 것 ${f.evidence.length}건` : `${f.evidence.length}건`} · 시각 ${SUM.sort.ev === "desc" ? "최신 순" : "오래된 순"})</div><table class="ev"><tr><th>시각</th><th>IP</th><th>Method</th><th>URL</th><th>코드</th></tr>` +
      f.evidence.map(e => `<tr><td class="mono">${esc(e.time)}</td><td class="mono">${esc(e.ip)}</td><td>${esc(e.method)}</td><td class="mono">${esc(e.url)}</td><td>${e.status || "-"}</td></tr>`).join("") + `</table>`;
  return h + `</div>`;
}

async function toggleDetail(tr) {
  const nx = tr.nextElementSibling;
  if (nx && nx.classList.contains("dtl")) { nx.remove(); return; }
  const d = await api("/api/ip?ip=" + encodeURIComponent(tr.dataset.ip));
  const row = document.createElement("tr"); row.className = "dtl";
  row.innerHTML = `<td colspan="6" class="detail"><div class="muted">국가: ${esc(d.country_name || "-")}${d.country ? ` (${esc(d.country)})` : ""}${d.foreign ? " · 해외" : ""} · User-Agent: <span class="mono">${esc(d.user_agent)}</span> · 응답코드 ${esc(d.statuses.map(([k, v]) => k + ":" + v).join(", "))}</div>
    ${d.findings.map(findingHtml).join("")}</td>`;
  tr.after(row);
}

const drop = $("drop"), fi = $("file");
drop.onclick = () => fi.click();
fi.onchange = () => { if (fi.files.length) upload([...fi.files]); fi.value = ""; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add("on"); };
drop.ondragleave = () => drop.classList.remove("on");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("on"); if (e.dataTransfer.files.length) upload([...e.dataTransfer.files]); };
$("reset").onclick = async () => { await api("/api/reset", {method: "POST"}); $("msg").textContent = ""; await refresh(); };
init().catch(e => {
  $("msg").innerHTML = TOKEN
    ? `<span class="err">${esc(e.message)}</span>`
    : `<span class="err">접근 토큰이 없습니다. 프로그램 콘솔 창에 표시된 <b>화면 주소</b>(# 뒤의 토큰 포함)로 다시 여세요.</span>`;
});
</script>
</body>
</html>
